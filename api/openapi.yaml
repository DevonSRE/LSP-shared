      description: Read-only view of courts for model retraining. Requires PLATFORM_MODEL_RETRAINER role.
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated court list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResult"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/retrain/court/{courtID}:
    get:
      tags: [Retraining]
