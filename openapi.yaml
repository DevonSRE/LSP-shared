  # ── Broadcasts ────────────────────────────────────────────────────────────────

  /platform/broadcasts:
    post:
      tags: [Broadcasts]
      summary: Create a broadcast
      description: >
        Creates a new broadcast with recipient resolution from the platform's user
        and litigant records. Pass status=SENT to dispatch immediately,
        status=SCHEDULED (with scheduled_at) to queue, or omit / pass DRAFT
        to save without sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastResponse"
        "400":
          description: Validation error or no resolvable recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    get:
      tags: [Broadcasts]
      summary: List broadcasts
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Searches title and subject (case-insensitive)
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BroadcastStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated broadcast list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BroadcastResponse"

  /platform/broadcasts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [Broadcasts]
      summary: Retrieve a broadcast
      responses:
        "200":
          description: Broadcast detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    patch:
      tags: [Broadcasts]
      summary: Update a broadcast
      description: Only DRAFT and SCHEDULED broadcasts can be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Updated broadcast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastResponse"
        "400":
          description: Validation error or non-editable status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    delete:
      tags: [Broadcasts]
      summary: Delete a broadcast
      description: Only DRAFT broadcasts can be deleted.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Broadcast is not a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/broadcasts/{id}/send:
    post:
      tags: [Broadcasts]
      summary: Send a broadcast immediately
      description: Dispatches the broadcast to all resolved recipients via Mailjet. Sets status to SENDING then SENT (or FAILED if all deliveries fail).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Broadcast dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Already sent, cancelled, or has no recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/broadcasts/{id}/schedule:
    post:
      tags: [Broadcasts]
      summary: Schedule a broadcast
      description: Sets status to SCHEDULED and stores the dispatch time. scheduled_at must be in the future.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastScheduleRequest"
      responses:
        "200":
          description: Broadcast scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Past date, already sent, or already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/broadcasts/{id}/cancel:
    post:
      tags: [Broadcasts]
      summary: Cancel a scheduled broadcast
      description: Only SCHEDULED broadcasts can be cancelled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Broadcast cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Broadcast is not in SCHEDULED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/broadcasts/{id}/duplicate:
    post:
      tags: [Broadcasts]
      summary: Duplicate a broadcast
      description: Creates a new DRAFT broadcast copied from the source. Title gets " (Copy)" suffix. Recipients are not copied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: Duplicated broadcast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastResponse"
        "400":
          description: Source broadcast not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/broadcasts/{id}/analytics:
    get:
      tags: [Broadcasts]
      summary: Get broadcast delivery analytics
      description: >
        Proxies per-message delivery and engagement statistics from Mailjet.
        Only available once the broadcast status is SENT or FAILED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastAnalytics"
        "400":
          description: Broadcast not yet sent or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

