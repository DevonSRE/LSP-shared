openapi: "3.0.3"
info:
  title: JudicAI – Platform Admin API
  version: "1.0.0"
  description: >
    All endpoints accessible to the Platform Administrator role.
    Covers court management, user management, analytics, model retraining
    access, and the email broadcast system.

servers:
  - url: /api/v1
    description: Production base path

tags:
  - name: Sponsors
    description: Court sponsor (donor) management and court linkage
  - name: Authentication
    description: Login, password reset, and password change
  - name: Analytics
    description: Platform-wide aggregate statistics
  - name: Courts
    description: Create and manage court records
  - name: Court Configuration
    description: Per-court branding and tenant config
  - name: Court Payment Configuration
    description: >
      Per-court pricing (price per page, CTC price) and payout bank account.
      Accessible to Judge, Legal Aide, Registrar, and Platform Admin users.
      The payout account can only be set once per court — see endpoint
      description below.
  - name: Court Subscription Billing
    description: >
      Devon → Court subscription plans and billing (distinct from Court
      Payment Configuration, which is Court → Lawyer). Platform Admin
      defines plans; a court checks out via Paystack (one-time per cycle
      or recurring/AUTO once a reusable card is on file). Accessible to
      Judge, Legal Aide, Registrar, and Platform Admin users, scoped to
      the caller's own court except plan creation (Platform Admin only).
  - name: Court Invoices
    description: >
      Billing records for Court Subscription Billing — both cycle-driven
      (from checkout/recurring charges) and ad-hoc invoices a Platform
      Admin raises outside the normal cycle. Reading/receipts are
      court-scoped; raising, reminding, reconciling, and waiving are
      Platform Admin only.
  - name: Users
    description: Create and manage platform users
  - name: Retraining
    description: Read-only access to courts/cases/casefiles for model retraining (PlatformModelRetrainer role)
  - name: Broadcasts
    description: Email broadcast campaigns
  - name: Broadcast Templates
    description: Reusable email templates

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RSA-signed JWT. Platform Admin endpoints require user_type = PLATFORM_ADMIN.
        Retraining endpoints additionally accept user_type = PLATFORM_MODEL_RETRAINER.

  schemas:

    # ── Sponsors ──────────────────────────────────────────────────────────────

    CreateCourtSponsorRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: "UNODC"
        link:
          type: string
          format: uri
          example: "https://unodc.org"
        description:
          type: string
        email:
          type: string
          format: email
          example: "contact@unodc.org"

    CourtSponsorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        link:
          type: string
        description:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LinkCourtsToSponsorRequest:
      type: object
      required: [court_ids]
      properties:
        court_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    # ── Authentication ────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "admin@judicai.ng"
        password:
          type: string
          format: password
          example: "P@ssw0rd!"

    EmailForPasswordReset:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "admin@judicai.ng"

    UserChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password

    UserLoginResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        user_type:
          $ref: "#/components/schemas/UserType"
        court_id:
          type: integer
          format: int64
        profile_image:
          type: string
          format: uri
          nullable: true
        require_new_password:
          type: boolean
        has_confirmed_policy:
          type: boolean

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "RS256-signed JWT. Include as `Authorization: Bearer <token>` on subsequent requests."
        user_details:
          $ref: "#/components/schemas/UserLoginResponse"
        court_details:
          type: object
          nullable: true
          description: Court record associated with the user, if any (null for PLATFORM_ADMIN).

    # ── Shared ────────────────────────────────────────────────────────────────

    GenericResponse:
      type: object
      properties:
        status:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    PaginatedResult:
      type: object
      properties:
        entity:
          type: string
        page:
          type: integer
        size:
          type: integer
        total_rows:
          type: integer
          format: int64
        total_pages:
          type: integer
        data:
          type: array
          items: {}

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        user_type:
          $ref: "#/components/schemas/UserType"
        court_id:
          type: integer
          format: int64

    # ── Enums ─────────────────────────────────────────────────────────────────

    UserType:
      type: string
      enum: [PLATFORM_ADMIN, PLATFORM_MODEL_RETRAINER, JUDGE, LEGAL_AIDE, REGISTRAR]

    Gender:
      type: string
      enum: [MALE, FEMALE]

    Status:
      type: string
      enum: [ACTIVE, INACTIVE]

    CourtType:
      type: string
      enum: [HIGH_COURT, MAGISTRATE_COURT, CUSTOMARY_COURT, SHARIA_COURT, APPEAL_COURT, SUPREME_COURT]

    AIModel:
      type: string
      enum: [ASSEMBLYAI, JUDICAI]

    BroadcastStatus:
      type: string
      enum: [DRAFT, SCHEDULED, SENDING, SENT, FAILED, CANCELLED]

    BroadcastRecipientType:
      type: string
      enum: [USER, LITIGANT]

    # ── Analytics ─────────────────────────────────────────────────────────────

    AIUsageEntry:
      type: object
      properties:
        court_id:
          type: integer
          format: int64
        court_name:
          type: string
        ai_model:
          $ref: "#/components/schemas/AIModel"
        active_days:
          type: integer
          format: int64
          description: Number of distinct calendar days on which at least one casefile was transcribed
        total_files_transcribed:
          type: integer
          format: int64
        first_activity:
          type: string
          format: date-time
          nullable: true
        last_activity:
          type: string
          format: date-time
          nullable: true

    PlatformAnalytics:
      type: object
      properties:
        total_court:
          type: integer
          format: int64
        total_cases:
          type: integer
          format: int64
        total_recordings:
          type: integer
          format: int64
        total_transcript:
          type: integer
          format: int64
        total_virtual:
          type: integer
          format: int64

    CourtSummary:
      type: object
      properties:
        court_id:
          type: integer
          format: int64
        court_name:
          type: string
        court_location:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        judge_name:
          type: string
        users_count:
          type: integer
          format: int64
        cases_count:
          type: integer
          format: int64
        case_files_count:
          type: integer
          format: int64
        last_casefile_date:
          type: string
          format: date-time
          nullable: true

    SingleCourtSummary:
      type: object
      properties:
        users_count:
          type: integer
          format: int64
        cases_count:
          type: integer
          format: int64
        case_files_count:
          type: integer
          format: int64
        last_casefile_date:
          type: string
          format: date-time

    # ── Courts ────────────────────────────────────────────────────────────────

    CourtRequest:
      type: object
      required: [name, court_type, court_code, state, location]
      properties:
        name:
          type: string
          example: "Kano State High Court"
        court_type:
          $ref: "#/components/schemas/CourtType"
        court_code:
          type: string
          example: "KN-HC-001"
        state:
          type: string
          example: "Kano"
        location:
          type: string
          example: "Kano Municipality"
        court_email:
          type: string
          format: email
        ai_model:
          $ref: "#/components/schemas/AIModel"
        judge_id:
          type: integer
          format: int64
        court_config_id:
          type: integer
          format: int64

    CourtResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        court_type:
          $ref: "#/components/schemas/CourtType"
        court_code:
          type: string
        state:
          type: string
        location:
          type: string
        court_email:
          type: string
        ai_model:
          $ref: "#/components/schemas/AIModel"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourtOnboardRequest:
      type: object
      required: [name, court_type, court_code, state, location, judge]
      description: Creates a court and its first judge user in one transaction.
      properties:
        name:
          type: string
        court_type:
          $ref: "#/components/schemas/CourtType"
        court_code:
          type: string
        state:
          type: string
        location:
          type: string
        court_email:
          type: string
          format: email
        ai_model:
          $ref: "#/components/schemas/AIModel"
        judge:
          $ref: "#/components/schemas/UserRequest"

    # ── Court Configuration ───────────────────────────────────────────────────

    CourtConfigRequest:
      type: object
      properties:
        domain:
          type: string
          example: "kano.judicai.ng"
        description:
          type: string
        logo:
          type: string
          format: uri
        background_image:
          type: string
          format: uri
        sponsors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              link:
                type: string
                format: uri
              description:
                type: string

    CourtConfigResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domain:
          type: string
        description:
          type: string
        logo:
          type: string
        background_image:
          type: string
        sponsors:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    # ── Court Payment Configuration ──────────────────────────────────────────

    CourtPaymentConfigRequest:
      type: object
      required: [price_per_page, ctc_price]
      properties:
        price_per_page:
          type: integer
          format: int64
          description: Price per page of a court proceeding (casefile) copy, in kobo.
          example: 5000
        ctc_price:
          type: integer
          format: int64
          description: Price for a Certified True Copy (CTC), in kobo.
          example: 200000
        account_number:
          type: string
          description: >
            Payout bank account number. Optional — omit to leave unset, or to
            update prices without touching the account. Can only be provided
            once per court: if the court's account_number is already set,
            submitting a different value here is rejected with a 400 error.
            Once locked there is no self-service way to change it — the court
            must contact support (not yet built).
          example: "0123456789"
        bank_name:
          type: string
          description: Required if account_number is provided.
          example: "First Bank"

    CourtPaymentConfigResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        court_id:
          type: integer
          format: int64
        price_per_page:
          type: integer
          format: int64
          description: In kobo.
        ctc_price:
          type: integer
          format: int64
          description: In kobo.
        account_number:
          type: string
        bank_name:
          type: string
        account_locked:
          type: boolean
          description: >
            True once account_number has been set. The frontend should
            disable the account/bank fields client-side when this is true,
            rather than relying solely on the API's rejection.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Court Subscription Billing ───────────────────────────────────────────

    BillingCycle:
      type: string
      enum: [MONTHLY, QUARTERLY, BIANNUAL, ANNUAL]

    PlanStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
      description: >
        A plan is created DRAFT, becomes PUBLISHED (selectable by courts)
        via POST /platform/court-subscription-plans/{id}?action=publish, and can be moved to ARCHIVED — which
        stops new selection without force-migrating existing subscribers.

    SubscriptionRenewal:
      type: string
      enum: [MANUAL, AUTO]

    SubscriptionStatus:
      type: string
      enum: [ACTIVE, GRACE, SUSPENDED]
      description: >
        SUSPENDED is not yet reachable — automatic suspension after grace
        expires is not built (Dunning settings / Workflow 5). GRACE is
        entered automatically only for AUTO subscriptions after a failed
        recurring charge.

    CourtSubscriptionPlanRequest:
      type: object
      required: [name, price, billing_cycle]
      description: >
        Used by both create (POST) and edit (PATCH) — same shape for both.
        waiver_cap_days and reverts_to_plan_id are required together when
        is_waiver is true.
      properties:
        name:
          type: string
          example: "Standard"
        price:
          type: integer
          format: int64
          description: Per billing cycle, in kobo.
          example: 15000000
        billing_cycle:
          $ref: "#/components/schemas/BillingCycle"
        is_waiver:
          type: boolean
          default: false
        waiver_cap_days:
          type: integer
          nullable: true
          description: Required if is_waiver is true — days after a subscriber goes onto this plan before they auto-revert.
          example: 90
        reverts_to_plan_id:
          type: integer
          format: int64
          nullable: true
          description: Required if is_waiver is true — the plan a subscriber reverts to when the cap expires.

    CourtSubscriptionPlanResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
          description: In kobo.
        billing_cycle:
          $ref: "#/components/schemas/BillingCycle"
        status:
          $ref: "#/components/schemas/PlanStatus"
        is_waiver:
          type: boolean
        waiver_cap_days:
          type: integer
          nullable: true
        reverts_to_plan_id:
          type: integer
          format: int64
          nullable: true
        created_by:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
          description: >
            Snapshot of the Platform Admin who created (or duplicated) the
            plan, taken at that moment — it does not follow later changes
            to that user. Absent for plans created before this field existed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourtSubscriptionCheckoutRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: integer
          format: int64

    CourtSubscriptionCheckoutResponse:
      type: object
      properties:
        authorization_url:
          type: string
          description: Redirect the court here to complete payment on Paystack.
        reference:
          type: string
          description: Paystack transaction reference — pass this to /court/subscription/verify.
        invoice_ref:
          type: string

    CourtSubscriptionVerifyRequest:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          description: >
            The Paystack reference from checkout. Nothing else is trusted
            from the client — court, plan, and expected amount all come
            from the backend's own pending invoice record keyed by this
            reference.

    CourtSubscriptionRenewalModeRequest:
      type: object
      required: [renewal_mode]
      properties:
        renewal_mode:
          $ref: "#/components/schemas/SubscriptionRenewal"
          description: >
            Setting AUTO requires a reusable Paystack authorization already
            on file (captured automatically from any prior successful
            payment) — returns a 400 if none exists yet. Never triggers a
            charge by itself.

    CourtSubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        court_id:
          type: integer
          format: int64
        plan_id:
          type: integer
          format: int64
        plan_name:
          type: string
        renewal_mode:
          $ref: "#/components/schemas/SubscriptionRenewal"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        fee:
          type: integer
          format: int64
          description: In kobo, snapshotted at last renewal.
        next_billing_date:
          type: string
          format: date-time
        has_saved_card:
          type: boolean
          description: Whether a reusable Paystack authorization is on file — required before renewal_mode can be set to AUTO.
        retry_count:
          type: integer
          description: Consecutive failed recurring-charge attempts since the subscription last entered GRACE. Resets to 0 on any successful charge.

    # ── Court Invoices ────────────────────────────────────────────────────────

    InvoiceStatus:
      type: string
      enum: [PENDING, OVERDUE, PAID, WAIVED]

    PaymentMethod:
      type: string
      enum: [PAYSTACK_CARD, PAYSTACK_TRANSFER, PAYSTACK_OTHER, PAYSTACK_RECURRING, MANUAL, WAIVED]
      description: >
        How an invoice was paid (the invoice's `paid_via`). Checkout
        payments are told apart by the Paystack channel the court used:
        PAYSTACK_CARD (card), PAYSTACK_TRANSFER (bank transfer) and
        PAYSTACK_OTHER (USSD, QR, mobile money or any other channel).
        PAYSTACK_RECURRING is an automatic charge of a saved card.
        MANUAL is a payment a Platform Admin recorded (for example an
        offline transfer). WAIVED means no money was collected. Only a
        card payment can be saved for auto-renewal.

    InvoiceRaiseRequest:
      type: object
      required: [court_id, period, amount, due_date]
      properties:
        court_id:
          type: integer
          format: int64
        period:
          type: string
          example: "Sep 2026"
        amount:
          type: integer
          format: int64
          description: In kobo.
        due_date:
          type: string
          format: date-time

    InvoiceWaiveRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Required — recorded in the audit trail.
          example: "NJC pilot programme"

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        court_id:
          type: integer
          format: int64
        subscription_id:
          type: integer
          format: int64
          nullable: true
          description: Null for ad-hoc invoices raised outside the normal billing cycle.
        ref:
          type: string
          example: "INV-2026-041"
        period:
          type: string
        amount:
          type: integer
          format: int64
          description: In kobo. Zeroed when status is WAIVED.
        due_date:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        paid_via:
          $ref: "#/components/schemas/PaymentMethod"
        waiver_reason:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Users ─────────────────────────────────────────────────────────────────

    UserRequest:
      type: object
      required: [first_name, last_name, email, gender, user_type]
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
        gender:
          $ref: "#/components/schemas/Gender"
        date_of_birth:
          type: string
          format: date
        password:
          type: string
        user_type:
          $ref: "#/components/schemas/UserType"
        status:
          $ref: "#/components/schemas/Status"
        court_id:
          type: integer
          format: int64

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        user_type:
          $ref: "#/components/schemas/UserType"
        status:
          $ref: "#/components/schemas/Status"
        court_id:
          type: integer
          format: int64
        profile_image:
          type: string
        require_new_password:
          type: boolean
        has_confirmed_policy:
          type: boolean
        created_by:
          $ref: "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Broadcasts ────────────────────────────────────────────────────────────

    RecipientRequest:
      type: object
      required: [recipient_id, recipient_type]
      properties:
        recipient_id:
          type: integer
          format: int64
        recipient_type:
          $ref: "#/components/schemas/BroadcastRecipientType"

    BroadcastRequest:
      type: object
      required: [title, subject, sender_name, reply_to_email, content, recipients]
      properties:
        title:
          type: string
          example: "June Platform Update"
        subject:
          type: string
          example: "Important update from JudicAI"
        sender_name:
          type: string
          example: "JudicAI Team"
        reply_to_email:
          type: string
          format: email
          example: "noreply@judicai.ng"
        content:
          type: string
          description: HTML email body
        status:
          $ref: "#/components/schemas/BroadcastStatus"
          description: >
            Optional. Omit or pass DRAFT to save without sending.
            Pass SENT to dispatch immediately.
            Pass SCHEDULED — requires scheduled_at.
        template_id:
          type: integer
          format: int64
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientRequest"

    BroadcastScheduleRequest:
      type: object
      required: [scheduled_at]
      properties:
        scheduled_at:
          type: string
          format: date-time
          example: "2026-07-01T09:00:00Z"

    BroadcastResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subject:
          type: string
        sender_name:
          type: string
        reply_to_email:
          type: string
        content:
          type: string
        status:
          $ref: "#/components/schemas/BroadcastStatus"
        template_id:
          type: integer
          format: int64
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        recipient_count:
          type: integer
          format: int64
        created_by:
          $ref: "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BroadcastAnalytics:
      type: object
      properties:
        broadcast_id:
          type: integer
          format: int64
        total_recipients:
          type: integer
          format: int64
        delivered:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        unique_opens:
          type: integer
          format: int64
        unique_clicks:
          type: integer
          format: int64

    BroadcastTemplateRequest:
      type: object
      required: [name, subject, content]
      properties:
        name:
          type: string
          example: "Feature Release"
        subject:
          type: string
          example: "New Feature Available on JudicAI"
        content:
          type: string
          description: HTML email body

    BroadcastTemplateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        subject:
          type: string
        content:
          type: string
        is_system:
          type: boolean
          description: System templates cannot be edited or deleted
        created_by:
          $ref: "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

# ── Paths ─────────────────────────────────────────────────────────────────────

paths:

  # ── Sponsors ──────────────────────────────────────────────────────────────────

  /platform/sponsors:
    post:
      tags: [Sponsors]
      summary: Create a sponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourtSponsorRequest"
      responses:
        "201":
          description: Sponsor created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtSponsorResponse"
        "400":
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    get:
      tags: [Sponsors]
      summary: List all sponsors
      responses:
        "200":
          description: Sponsor list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourtSponsorResponse"

  /platform/sponsors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [Sponsors]
      summary: Retrieve a sponsor
      responses:
        "200":
          description: Sponsor detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtSponsorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/sponsors/{id}/link:
    post:
      tags: [Sponsors]
      summary: Link courts to a sponsor
      description: >
        Sets the sponsor_id on all supplied courts to this sponsor.
        All court IDs are validated before any update is applied — if any ID
        is invalid the entire request is rejected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCourtsToSponsorRequest"
      responses:
        "200":
          description: Courts linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Invalid sponsor ID, invalid court ID(s), or empty list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/sponsors/{id}/courts:
    get:
      tags: [Sponsors]
      summary: List courts linked to a sponsor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated court list for this sponsor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourtResponse"
        "400":
          description: Invalid sponsor ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Authentication ────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      description: >
        Authenticates a user with email and password.
        Returns an RS256-signed JWT valid for subsequent requests.
        Include the token as `Authorization: Bearer <token>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid credentials or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /auth/request_reset_link:
    post:
      tags: [Authentication]
      summary: Request password reset link
      description: >
        Sends a password reset link to the supplied email address.
        Returns 200 regardless of whether the email exists (to prevent enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailForPasswordReset"
      responses:
        "200":
          description: Reset link sent (if email is registered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Validation error (invalid email format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /users/{id}/change_password:
    post:
      tags: [Authentication]
      summary: Change password
      description: >
        Changes the password for the specified user. Requires a valid JWT.
        Accessible to JUDGE, LEGAL_AIDE, PLATFORM_ADMIN, and REGISTRAR roles.
        Supply `old_password` when the user knows their current password.
        Omit `old_password` when `require_new_password` is true (first-login forced reset).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the user whose password is being changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Incorrect old password or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Analytics ────────────────────────────────────────────────────────────────

  /platform/analytics:
    get:
      tags: [Analytics]
      summary: Platform-wide aggregate stats
      description: Returns total counts of courts, cases, recordings, transcripts, and virtual meetings across the entire platform.
      responses:
        "200":
          description: Aggregate analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnalytics"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/analytics/group:
    get:
      tags: [Analytics]
      summary: Per-court analytics list
      description: Paginated list of each court's summary metrics — user count, case count, casefile count, and last activity date.
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by court name
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated court summary list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourtSummary"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/analytics/{courtID}/metric:
    get:
      tags: [Analytics]
      summary: Single court metric
      description: Returns aggregated counts for a specific court — users, cases, casefiles, last activity.
      parameters:
        - name: courtID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Court metric detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleCourtSummary"
        "400":
          description: Invalid court ID or court not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/analytics/ai-usage:
    get:
      tags: [Analytics]
      summary: AI transcription usage per court
      description: >
        Returns a paginated list of courts and their AI transcription activity
        within the given date window. A court appears in results only if at least
        one casefile was transcribed (by ASSEMBLYAI or JUDICAI) during the period.
        Use `min_days` to filter to courts that were active for at least N distinct
        calendar days. Use `ai_model` to narrow to one model only.
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-06-30"
        - name: ai_model
          in: query
          schema:
            $ref: "#/components/schemas/AIModel"
          description: Filter to a specific AI model. Omit to include both.
        - name: min_days
          in: query
          schema:
            type: integer
            minimum: 1
          description: Only return courts active for at least this many distinct days
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated AI usage list ordered by active_days descending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AIUsageEntry"
        "400":
          description: Missing start_date / end_date or invalid min_days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Courts ────────────────────────────────────────────────────────────────────

  /courts:
    get:
      tags: [Courts]
      summary: List courts
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by court name
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated court list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourtResponse"

    post:
      tags: [Courts]
      summary: Create a court
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtRequest"
      responses:
        "201":
          description: Court created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /courts/constants:
    get:
      tags: [Courts]
      summary: Court type constants
      description: Returns lists of valid court_type and ai_model enum values.
      responses:
        "200":
          description: Enum constants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /courts/onboard:
    post:
      tags: [Courts]
      summary: Onboard a court with its first judge
      description: Creates a court record and the judge user account in a single transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtOnboardRequest"
      responses:
        "201":
          description: Court and judge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /courts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [Courts]
      summary: Retrieve a court
      responses:
        "200":
          description: Court detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtResponse"
        "400":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    patch:
      tags: [Courts]
      summary: Update a court
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

    delete:
      tags: [Courts]
      summary: Delete a court
      responses:
        "204":
          description: Deleted
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Court Configuration ───────────────────────────────────────────────────────

  /courts/configurations:
    get:
      tags: [Court Configuration]
      summary: List court configurations
      responses:
        "200":
          description: Paginated configuration list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResult"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourtConfigResponse"

    post:
      tags: [Court Configuration]
      summary: Create a court configuration
      description: Stores branding (logo, background, sponsors, domain) for a specific court's tenant portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtConfigRequest"
      responses:
        "201":
          description: Configuration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtConfigResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /courts/configurations/{id}:
    get:
      tags: [Court Configuration]
      summary: Retrieve a court configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Configuration detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/GenericResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourtConfigResponse"
        "400":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Court Payment Configuration ─────────────────────────────────────────────

  /court/payment_config:
    get:
      tags: [Court Payment Configuration]
      summary: Get the caller's court payment configuration
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin users.
        Scoped to the authenticated user's own court. Returns a 200 with
        account_locked: false and empty pricing/account fields if the court
        hasn't configured payment settings yet — this is a normal first-time
        state, not an error.
      responses:
        "200":
          description: Current payment configuration (or an unconfigured default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtPaymentConfigResponse"

    put:
      tags: [Court Payment Configuration]
      summary: Set or update the caller's court payment configuration
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin users.
        Scoped to the authenticated user's own court. Price fields are
        always updatable. account_number can only be submitted once per
        court — if it's already set, submitting a different value returns
        a 400 with an explanatory message and leaves the stored account
        untouched. There is currently no in-app way to change a locked
        account (support contact flow not yet built).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtPaymentConfigRequest"
      responses:
        "200":
          description: Payment configuration created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtPaymentConfigResponse"
        "400":
          description: >
            Validation error, or a rejected attempt to change an
            already-locked payout account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Court Subscription Billing ──────────────────────────────────────────────

  /court/subscription-plans:
    get:
      tags: [Court Subscription Billing]
      summary: List published subscription plans
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin
        users. Only PUBLISHED plans — what a court can actually select.
        For DRAFT/ARCHIVED visibility, a
        Platform Admin uses GET /platform/court-subscription-plans.
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourtSubscriptionPlanResponse"

  /platform/court-subscription-plans:
    get:
      tags: [Court Subscription Billing]
      summary: List all subscription plans (any status)
      description: Platform Admin only. For plan management screens — includes DRAFT and ARCHIVED plans alongside PUBLISHED.
      responses:
        "200":
          description: Plan list, all statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourtSubscriptionPlanResponse"
    post:
      tags: [Court Subscription Billing]
      summary: Create a subscription plan
      description: >
        Platform Admin only. Always creates a DRAFT — not selectable by
        any court until published (POST /platform/court-subscription-plans/{id}?action=publish). Editing an existing plan's price
        (PATCH /platform/court-subscription-plans/{id}) never retroactively
        changes an already-locked-in subscription's fee — only future
        subscribe/renew actions use a new price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtSubscriptionPlanRequest"
      responses:
        "201":
          description: Plan created (DRAFT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionPlanResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/court-subscription-plans/{id}:
    patch:
      tags: [Court Subscription Billing]
      summary: Edit a plan's name/price/cycle/waiver fields
      description: >
        Platform Admin only. Does not change status — a DRAFT stays
        DRAFT, a PUBLISHED plan stays PUBLISHED. Use POST with the
        `action` query parameter for status changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtSubscriptionPlanRequest"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionPlanResponse"
        "400":
          description: Plan not found, or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
    post:
      tags: [Court Subscription Billing]
      summary: Publish or archive a plan
      description: >
        Platform Admin only. The action is chosen with the required
        `action` query parameter — it is not part of the path.


        `action=publish` makes a plan selectable by courts. It is a
        single call from a single Platform Admin at any price (there is
        no approval step), and is idempotent for an already-published
        plan.


        `action=archive` stops new selection — by any court, including one
        switching plans — without force-migrating existing subscribers,
        who may still renew the same archived plan.


        `action=duplicate` copies the plan (name with a " (Copy)" suffix,
        price, cycle and waiver fields) into a new DRAFT plan, returned
        with 201. Works on a plan in any status. The new plan's
        `created_by` is the admin who duplicated it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [publish, archive, duplicate]
      responses:
        "200":
          description: Plan published or archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionPlanResponse"
        "201":
          description: "`action=duplicate` — the new draft plan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionPlanResponse"
        "400":
          description: Missing or unknown action, or plan not found (for duplicate, source plan not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
    delete:
      tags: [Court Subscription Billing]
      summary: Delete a draft plan
      description: >
        Platform Admin only. Only a DRAFT plan can be deleted (soft
        delete). A plan that has been published — even if archived since —
        can only be archived, because courts, invoices and audit history
        may already point at it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Plan deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Plan not found, or the plan is not a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"


  /court/subscription:
    get:
      tags: [Court Subscription Billing]
      summary: Get the caller's court subscription
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin
        users. Scoped to the authenticated user's own court. Returns a
        200 with an empty/zero-value response if the court has never
        subscribed — a normal first-time state, not an error.
      responses:
        "200":
          description: Current subscription (or an unsubscribed default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionResponse"

  /court/subscription/checkout:
    post:
      tags: [Court Subscription Billing]
      summary: Start paying for a plan/cycle
      description: >
        Initiates a backend-side Paystack transaction (the backend, not
        the frontend, calls Paystack — it already knows the court, plan,
        and price) and returns a redirect URL. Every call starts a fresh
        Paystack transaction; a prior abandoned attempt's link is never
        reused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtSubscriptionCheckoutRequest"
      responses:
        "200":
          description: Redirect the court to authorization_url to complete payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionCheckoutResponse"
        "400":
          description: Validation error, the plan was not found, or the plan is not PUBLISHED and the caller isn't already on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /court/subscription/verify:
    post:
      tags: [Court Subscription Billing]
      summary: Confirm a checkout payment and activate/extend the subscription
      description: >
        Call this after Paystack redirects the court back. Idempotent — a
        reload/re-hit with an already-processed reference is a no-op, not
        a second extension. Rejects if the verified amount doesn't match
        the plan's price, or if Paystack reports the payment as anything
        other than successful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtSubscriptionVerifyRequest"
      responses:
        "200":
          description: Subscription activated/extended (or unchanged, if already applied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionResponse"
        "400":
          description: >
            No payment found for this reference, payment not completed,
            or amount mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /court/subscription/renewal-mode:
    post:
      tags: [Court Subscription Billing]
      summary: Switch between manual and automatic renewal
      description: >
        Never charges the court — setting AUTO only reuses a reusable
        Paystack authorization already captured from a prior successful
        payment (has_saved_card on the subscription response). Only a
        card payment leaves a reusable authorization; a bank transfer
        cannot be renewed automatically, so a court that pays by transfer
        stays on MANUAL and pays each cycle through checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtSubscriptionRenewalModeRequest"
      responses:
        "200":
          description: Renewal mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtSubscriptionResponse"
        "400":
          description: >
            No subscription to modify, or no saved card on file for AUTO.
            A court that has only paid by bank transfer has no card on
            file, so it stays on manual renewal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /public/court-billing/paystack/webhook:
    post:
      tags: [Court Subscription Billing]
      summary: Paystack recurring-charge webhook (charge.success / charge.failed)
      description: >
        Called by Paystack directly, not by JudicAI frontends — no auth
        middleware. Trust comes entirely from verifying the
        X-Paystack-Signature header (HMAC-SHA512 of the raw request body,
        keyed by the Paystack secret key) before anything in the payload
        is acted on. Confirms recurring/AUTO charges, and also any
        checkout payment that completes after the court has left the
        Paystack page (typically a bank transfer), by matching the
        transaction reference to its invoice. The invoice's `paid_via`
        records which kind it was. A payment already confirmed through
        /court/subscription/verify is left unchanged.
      responses:
        "200":
          description: Event processed (or intentionally ignored, e.g. an unknown reference or uninteresting event type)
        "400":
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  # ── Court Invoices ───────────────────────────────────────────────────────────

  /court/invoices:
    get:
      tags: [Court Invoices]
      summary: List the caller's court's invoices
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin
        users. Scoped to the authenticated user's own court. Includes
        both cycle-driven (from checkout/recurring charges) and ad-hoc
        invoices together.
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceResponse"

  /platform/court-invoices:
    post:
      tags: [Court Invoices]
      summary: Raise an ad-hoc invoice
      description: >
        Platform Admin only. Bills a court outside the normal
        subscription cycle — the resulting invoice has no
        subscription_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRaiseRequest"
      responses:
        "201":
          description: Invoice raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /court/invoices/{id}/receipt:
    get:
      tags: [Court Invoices]
      summary: Get a paid invoice's receipt details
      description: >
        Accessible to Judge, Legal Aide, Registrar, and Platform Admin
        users. Non-admin callers are scoped to their own court — a
        cross-tenant request gets the same 400 as a nonexistent invoice,
        no existence leak. Returns an error if the invoice isn't PAID yet.
        Does not generate a downloadable PDF — this returns invoice
        details only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Invoice not found (including cross-tenant), or not yet paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/court-invoices/{id}/remind:
    post:
      tags: [Court Invoices]
      summary: Send an on-demand reminder for a pending/overdue invoice
      description: >
        Platform Admin only. Recipient is whatever email was captured
        from the court's last successful subscription payment — a court
        that has never paid has no reminder recipient on file yet and
        this returns a 400 in that case (known limitation: does not fall
        back to looking up court staff more broadly).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "400":
          description: Invoice not found, not in a remindable status, or no billing contact on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/court-invoices/{id}/mark-paid:
    post:
      tags: [Court Invoices]
      summary: Record a manual/offline payment
      description: >
        Platform Admin only. Idempotent — calling this again on an
        already-PAID invoice is a no-op, not an error. If the invoice is
        tied to a subscription cycle, the subscription reactivates/
        extends exactly like a successful Paystack charge would.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Invoice marked paid (subscription reactivated/extended if applicable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Invoice not found, or already waived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

  /platform/court-invoices/{id}/waive:
    post:
      tags: [Court Invoices]
      summary: Waive an invoice
      description: >
        Platform Admin only. Zeroes the amount and requires a reason,
        recorded in the audit trail. Rejected if the invoice is already
        paid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceWaiveRequest"
      responses:
        "200":
          description: Invoice waived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Invoice not found, or already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"

